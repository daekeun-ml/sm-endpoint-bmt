[project]
name = "sm-endpoint-bmt"
version = "1.0.0"
description = "A SageMaker endpoint benchmark tool similar to vLLM bench serve."
readme = "README.md"
requires-python = ">=3.10"
# 벤치마크를 돌리는 데 반드시 필요한 것만 둔다. 나머지는 optional-dependencies 로 뺐다 —
# 이 패키지를 다른 프로젝트에 add 할 때 쓰지도 않는 무거운 의존성이 함께 끌려오지 않게 한다.
dependencies = [
    "boto3>=1.43.62",
    "botocore>=1.43.62",
    # 🔴 하한을 낮게, 상한은 열어 둔다. 쓰는 API 는 percentile/mean/median/std/zeros/arange/
    #    max/ceil/random 뿐이라 1.x 부터 있는 것들이다. >=2.5.1 로 올리면 vLLM 과 같은 환경에
    #    들어가지 못한다 — vLLM 은 numba 를 통해 numpy<2.5 를 요구한다(실측: uv lock 해결 실패).
    "numpy>=1.24",
    "python-dotenv>=1.2.2",
    # 🔴 v3 floor. create_endpoint.py 는 sagemaker.core / sagemaker.serve.ModelBuilder 를 쓰고,
    #    v2 의 Estimator·HuggingFaceModel·sagemaker.Session() 은 v3 에서 제거됐다. 2.x 를 허용하면
    #    import 는 되지만 다른 코드 경로를 탄다.
    "sagemaker>=3.18.0,<4",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# --tokenizer 로 토큰 수를 정확히 셀 때. 없으면 서버가 보낸 usage 만 쓰고 경고합니다.
tokenizer = ["transformers>=5.14.1"]
# --dataset-name sharegpt / huggingface 를 쓸 때. random 데이터셋은 이것 없이 돕니다.
datasets = ["datasets>=5.0.1"]
# mcp/sm_endpoint_mcp.py (MCP 서버) 를 띄울 때.
mcp = ["fastmcp>=3.4.5"]
# 위 셋 전부.
all = ["transformers>=5.14.1", "datasets>=5.0.1", "fastmcp>=3.4.5"]

# 🔴 build-system 과 py-modules 가 있어야 `uv add`/`pip install` 로 설치된다. 없으면 프로젝트를
#    열어 스크립트로 실행하는 것만 되고, 다른 리포에서 라이브러리로 가져다 쓸 수 없다.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 플랫 레이아웃(패키지 디렉터리 없이 루트에 .py 가 놓인 구조)이라 모듈을 명시한다.
# autodetect 에 맡기면 hatchling 이 어느 것이 배포 대상인지 판단하지 못해 빌드가 실패한다.
# 🔴 packages 와 include 를 함께 쓰면 루트의 .py 가 휠에서 빠진다(실측: sagemaker_benchmark.py
#    누락). 플랫 모듈은 force-include 로 넣는다 — 목적지 경로를 명시해야 확실히 들어간다.
[tool.hatch.build.targets.wheel]
packages = ["autoscaling"]

# 🔴 mcp/ 를 packages 에 넣지 않는다. PyPI 에 `mcp` 패키지(MCP SDK, fastmcp 의 의존성)가 있어서
#    site-packages/mcp/ 를 그 패키지와 공유하게 된다 — 실측으로 두 배포가 같은 디렉터리에 파일을
#    쓰는 것을 확인했다(우리 1개 + MCP SDK 111개). 지금은 파일 이름이 겹치지 않아 동작하지만,
#    한쪽이 같은 이름을 추가하면 조용히 덮어쓴다. 그래서 휠에서는 sm_endpoint_mcp.py 를 최상위
#    모듈로 넣는다. 리포의 mcp/ 디렉터리는 그대로 두므로 문서의 `python mcp/sm_endpoint_mcp.py`
#    는 계속 동작하고, 설치 환경에서는 `python -m sm_endpoint_mcp` 로 부른다.
[tool.hatch.build.targets.wheel.force-include]
"sagemaker_benchmark.py" = "sagemaker_benchmark.py"
"benchmark_datasets.py" = "benchmark_datasets.py"
"create_endpoint.py" = "create_endpoint.py"
"test_endpoint.py" = "test_endpoint.py"
"check_metrics.py" = "check_metrics.py"
"mcp/sm_endpoint_mcp.py" = "sm_endpoint_mcp.py"

[project.scripts]
# 설치하면 `sm-bench` 로 부를 수 있다. `python sagemaker_benchmark.py` 와 같은 진입점이다.
# 🔴 main 이 아니라 cli 를 가리킨다 — main 은 결과 dict 를 돌려주는 라이브러리 함수이고,
#    console_scripts 는 반환값을 종료 코드로 쓰므로 dict 를 그대로 두면 종료 코드가 어그러진다.
#    cli 가 completed 를 보고 종료 코드를 정한다.
sm-bench = "sagemaker_benchmark:cli"
